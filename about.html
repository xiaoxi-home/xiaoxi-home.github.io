<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小希之家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #121212;
            color: #e0e0e0;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* 顶部导航栏 */
        .navbar {
            width: 100%;
            background: #1a1a2e;
            border-bottom: 2px solid #0f3460;
            padding: 15px 0;
            box-shadow: 0 0 20px rgba(15, 52, 96, 0.3);
        }
        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            padding: 0 20px;
        }
        .nav-item {
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
            padding: 5px 10px;
        }
        .nav-item:hover {
            color: #fff;
            text-shadow: 0 0 10px #00d4ff;
            transform: scale(1.08);
        }

        
        .img-box {
            width: 100%;
            height: 380px;
            background: #1e1e2f;
            border: 2px solid #0f3460;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00d4ff;
            font-size: 1.3rem;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,212,255,0.15);
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 点击提示弹窗样式 */
        .tip-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1e2f;
            border: 1px solid #00d4ff;
            border-radius: 12px;
            padding: 30px 40px;
            color: #00d4ff;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(0,212,255,0.3);
            z-index: 1000;
            display: none;
        }
        .tip-modal.show {
            display: block;
            animation: fadeIn 0.3s forwards;
        }
        @keyframes fadeIn {
            0% { opacity:0; transform: translate(-50%, -55%); }
            100% { opacity:1; transform: translate(-50%, -50%); }
        }

        .footer {
            text-align: center;
            padding: 25px;
            color: #888;
            border-top: 1px solid #222;
            margin-top: 30px;
        }
    </style>
</head>
